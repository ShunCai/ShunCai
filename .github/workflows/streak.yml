name: 更新连续贡献卡

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成连续贡献卡
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=github-dark&hide_border=true&disable_animations=true&locale=zh_Hans
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "chore: 更新连续贡献卡" || exit 0
          git push
